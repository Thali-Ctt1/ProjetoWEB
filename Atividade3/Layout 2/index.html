<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Layout 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <div class="logo">LOGO</div>

        <nav class="menu">
            <a href="#">Produtos</a>
            <a href="#">Soluções</a>
            <a href="#">Comunidade</a>
            <a href="#">Recursos</a>

        <div class="acoes">
            <button>Entrar</button>
            <button>Falar com vendas</button>

    <main class="principal">

            <p>Texto descritivo simulando conteúdo do site para estruturar o layout.</p>

            <div class="botoes">
                <button>Botão 1</button>

            </div>

        <section class="conteudo-direito">
            <div class="area-imagem">
                IMAGEM and ILUSTRAÇÃO
            </div>
        </section>

    </main>
